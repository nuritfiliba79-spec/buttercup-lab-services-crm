<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttercup Lab Services · CRM</title>
  <link rel="icon" href="img/buttercup.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Login -->
  <div id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="login-brand">
        <img src="img/buttercup.svg" alt="" class="logo logo-lg">
        <div>
          <div class="brand-name">Buttercup Lab Services</div>
          <div class="brand-sub">מערכת לניהול לקוחות ובדיקות מעבדה</div>
        </div>
      </div>
      <label>מייל<input name="email" type="email" dir="ltr" autocomplete="username" required></label>
      <label>סיסמה<input name="password" type="password" dir="ltr" autocomplete="current-password" required></label>
      <div class="error" id="login-error" hidden></div>
      <button class="btn primary block" type="submit">כניסה</button>
    </form>
  </div>

  <!-- App -->
  <div id="app-view" class="shell" hidden>
    <aside class="sidebar">
      <a href="#/dashboard" class="brand">
        <img src="img/buttercup.svg" alt="" class="logo">
        <span>
          <span class="brand-name">Buttercup</span>
          <span class="brand-sub">Lab Services CRM</span>
        </span>
      </a>
      <nav class="nav">
        <a href="#/dashboard" data-page="dashboard">לוח בקרה</a>
        <a href="#/clients" data-page="clients">לקוחות</a>
        <a href="#/projects" data-page="projects">פרויקטים</a>
        <a href="#/labs" data-page="labs">מעבדות</a>
      </nav>
      <div class="user">
        <span id="user-email" dir="ltr"></span>
        <button class="btn ghost-light small" id="logout">יציאה</button>
      </div>
    </aside>
    <main class="content" id="main"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/clients.js"></script>
  <script src="js/pages/projects.js"></script>
  <script src="js/pages/project.js"></script>
  <script src="js/pages/labs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
